services:
  - type: web
    name: ledgerman
    env: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /config.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: redirect
        source: /*
        destination: https://app.ledgerman.org/:splat
        action: 301

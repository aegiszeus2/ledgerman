<?xml version="1.0" encoding="UTF-8"?>
<!-- LedgerMan — Corrected Logo SVG (replaces logo.jpg which was missing the R) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 152" width="520" height="152">

  <!-- Background -->
  <rect width="520" height="152" fill="#ffffff"/>

  <!-- ============================= ICON AREA (0–130) ============================= -->

  <!-- Building columns (dark navy, ascending left to right) -->
  <rect x="6"  y="64"  width="18" height="64" rx="2" fill="#1a3566"/>
  <rect x="30" y="44"  width="18" height="84" rx="2" fill="#1e3e78"/>
  <rect x="54" y="22"  width="18" height="106" rx="2" fill="#1a3566"/>

  <!-- Tall architectural building (rightmost, with window detail) -->
  <rect x="80" y="10" width="22" height="118" rx="2" fill="#162f5e"/>
  <rect x="83" y="16" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>
  <rect x="93" y="16" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>
  <rect x="83" y="24" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>
  <rect x="93" y="24" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>
  <rect x="83" y="32" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>
  <rect x="93" y="32" width="6"  height="4"   rx="1" fill="#2a4a8a" opacity="0.55"/>

  <!-- Diagonal teal trend line (lower-left → upper-right) -->
  <line x1="10" y1="122" x2="116" y2="24" stroke="#007a7a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Circuit-style waypoint dots along trend line -->
  <circle cx="30"  cy="106" r="4.5" fill="#00a8a8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="58"  cy="82"  r="4.5" fill="#00a8a8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="86"  cy="56"  r="4.5" fill="#00a8a8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="116" cy="24"  r="5.5" fill="#00c0c0" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Arrow head at top of trend line -->
  <polygon points="116,24 103,21 109,36" fill="#007a7a"/>

  <!-- Gear / cog (bottom-right of icon area) -->
  <circle cx="114" cy="112" r="17" fill="none" stroke="#1a3566" stroke-width="4"/>
  <circle cx="114" cy="112" r="10" fill="none" stroke="#1a3566" stroke-width="2.5"/>
  <!-- Cardinal teeth -->
  <rect x="110.5" y="92"    width="7" height="8" rx="1" fill="#1a3566"/>
  <rect x="110.5" y="120"   width="7" height="8" rx="1" fill="#1a3566"/>
  <rect x="90"    y="108.5" width="8" height="7" rx="1" fill="#1a3566"/>
  <rect x="118"   y="108.5" width="8" height="7" rx="1" fill="#1a3566"/>
  <!-- Diagonal teeth -->
  <rect x="95" y="95"  width="7" height="7" rx="1" fill="#1a3566" transform="rotate(45,98.5,98.5)"/>
  <rect x="124" y="95" width="7" height="7" rx="1" fill="#1a3566" transform="rotate(-45,127.5,98.5)"/>
  <rect x="95" y="120" width="7" height="7" rx="1" fill="#1a3566" transform="rotate(-45,98.5,123.5)"/>
  <rect x="124" y="120" width="7" height="7" rx="1" fill="#1a3566" transform="rotate(45,127.5,123.5)"/>
  <!-- Gear center (teal) -->
  <circle cx="114" cy="112" r="7" fill="#007a7a" opacity="0.9"/>

  <!-- ============================= TEXT AREA (138+) ============================= -->

  <!-- Brand name: LEDGER (navy) + MAN (teal) — "R" is critical! -->
  <text x="142" y="92"
        font-family="'Arial Black', 'Arial Bold', Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="66"
        textLength="355"
        lengthAdjust="spacingAndGlyphs">
    <tspan fill="#1a3566">LEDGER</tspan><tspan fill="#007a7a">MAN</tspan>
  </text>

  <!-- Tagline -->
  <text x="143" y="121"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400"
        font-size="12.5"
        fill="#888888"
        textLength="355"
        lengthAdjust="spacingAndGlyphs">
    AUTOMATED CONSTRUCTION INTELLIGENCE
  </text>

</svg>
